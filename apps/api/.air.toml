# Air - Live reload for Go apps
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  # Build command
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  # Binary file to run after build
  bin = "./tmp/main.exe"
  # Watch these file extensions
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Exclude directories
  exclude_dir = ["assets", "tmp", "vendor", "node_modules"]
  # Exclude files
  exclude_file = []
  # Exclude specific regular expressions
  exclude_regex = ["_test\\.go"]
  # Exclude unchanged files
  exclude_unchanged = true
  # Follow symlinks
  follow_symlink = false
  # Delay before rebuilding (in ms)
  delay = 1000
  # Stop running old binary when building
  stop_on_error = true
  # Send interrupt signal before killing process
  send_interrupt = true
  # Kill delay after interrupt (in ms)
  kill_delay = 500
  # Log file (leave empty to use stdout)
  log = ""

[log]
  # Show log time
  time = false
  # Only show main log (silences watcher, build, runner)
  main_only = false

[color]
  # Customize each part's color. If no color found, use the raw app log.
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true
