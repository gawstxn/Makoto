services:
  postgres:
    image: postgres:17-alpine
    container_name: makoto-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: makoto
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
